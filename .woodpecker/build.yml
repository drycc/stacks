matrix:
  platform:
    - linux/amd64
    - linux/arm64

labels:
  type: exec
  platform: ${platform}

steps:
- name: reconcile-linux
  image: bash
  commands:
  - ./build.sh reconcile
  environment:
    CODENAME:
      from_secret: codename
    OSS_ENDPOINT:
      from_secret: oss_endpoint
    OSS_ACCESS_KEY_ID:
      from_secret: oss_access_key_id
    OSS_ACCESS_KEY_SECRET:
      from_secret: oss_access_key_secret
    CONTAINER_PULL_SECRETS:
      from_secret: container_pull_secrets
    GITHUB_TOKEN:
      from_secret: github_token
    RECONCILE_DRY_RUN: "0"
  when:
    event:
    - cron
