when:
- event: push

labels:
  type: exec
  platform: linux/amd64

steps:
- name: test
  image: python:3.13
  commands:
  - python -m pip install --no-cache-dir -r requirements.txt
  - python -m unittest discover -s tests -p 'test_*.py' -v
  - for test_script in tests/test_*.sh; do bash "$test_script" || exit 1; done
